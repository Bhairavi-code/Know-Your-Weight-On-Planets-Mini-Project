<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Weight</title>
</head>
<body>
    <video id="spaceVideo" autoplay loop style="width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: -1;">
        <source src="Space_Travel.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div style="text-align: center;">
    <h1><em style="color: rgb(161, 85, 231);">To know your weight on different planets..</em></h1>
    <h2 style="color: cyan;">Enter your weight below:</h2>
    <input type="number" placeholder="Enter your weight" id="weight">
    <button onclick="calculateWeight()">Submit</button><br><br>
    </div><hr>
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 70px;">
    <div style="display: inline-flexbox;"><img src="Mercury.png"><p id="sp1" style="color: white; text-align: center;"></p></div>
    <div style="display: inline-flexbox;"><img src="Venus.png"><p id="sp2" style="color: white; text-align: center;"></p></div>
    <div style="display: inline-flexbox;"><img src="Earth.png"><p id="sp3" style="color: white; text-align: center;"></p></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 70px; margin-right: 10px;">
    <div style="display: inline-flexbox;"><img src="Mars.png"><p id="sp4" style="color: white; text-align: center;"></p></div>
    <div style="display: inline-flexbox;"><img src="Jupiter.png"><p id="sp5" style="color: white; text-align: center;"></p></div>
    <div style="display: inline-flexbox;"><img src="Saturn.png"><p id="sp6" style="color: white; text-align: center;"></p></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 70px; margin-left: 10px;">
        <div style="display: inline-flexbox;"><img src="Uranus.png"><p id="sp7" style="color: white; text-align: center;"></p></div>
        <div style="display: inline-flexbox;"><img src="Neptune.png"><p id="sp8" style="color: white; text-align: center;"></p></div>
        <div style="display: inline-flexbox;"><img src="Pluto.png"><p id="sp9" style="color: white; text-align: center;"></p></div>
    </div>
    <div style="display: flex; justify-content: flex-end;">
        <button id="audioBtn" onclick="changeAudioSettings()">Mute Audio</button>
    </div>
    <script>
        function calculateWeight() {
            var weight = document.getElementById("weight").value;
            var planets = {
                "Mercury": 0.38,
                "Venus": 0.91,
                "Earth": 1.00,
                "Mars": 0.38,
                "Jupiter": 2.34,
                "Saturn": 1.06,
                "Uranus": 0.92,
                "Neptune": 1.19,
                "Pluto": 0.07
            };
            var planetNames = Object.keys(planets);
            for(var i = 0; i < planetNames.length; i++) {
                var planet = planetNames[i];
                var planetWeight = (weight * planets[planet]).toFixed(2);
                document.getElementById("sp"+(i+1)).innerHTML = `${planet}\n${planetWeight} Kg.`;
            }
        }
        function changeAudioSettings() {
            var audioButton = document.getElementById("audioBtn");
            var video = document.getElementById("spaceVideo");
            if (video.muted) {
                video.muted = false;
                audioButton.innerHTML = "Mute Audio";
            } else {
                video.muted = true;
                audioButton.innerHTML = "Unmute Audio";
            }
        }
    </script>
</body>
</html>
